workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.otmane.nutrilifeapp
    scripts:
      - name: Set up code signing settings
        script: |
          app-store-connect fetch-signing-files "com.otmane.nutrilifeapp" --type APP_STORE --create
      - name: Build Flutter ipa
        script: |
          flutter build ipa --release
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        artifact: build/ios/ipa/*.ipa